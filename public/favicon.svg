<svg width="144" height="144" viewBox="0 0 144 144" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c77af5" />
      <stop offset="1" stop-color="#a23fe0" />
    </linearGradient>
    <!-- A single beveled Tetris block, drawn at the origin and stamped per cell. -->
    <g id="blk">
      <rect x="3" y="3" width="30" height="30" rx="6" fill="url(#face)" stroke="#7d2fb0" stroke-width="2" />
      <rect x="8" y="8" width="20" height="4" rx="2" fill="#ffffff" opacity="0.35" />
    </g>
  </defs>
  <!-- Board-like rounded background -->
  <rect width="144" height="144" rx="32" fill="#14161d" />
  <!-- T-tetromino (spawn orientation): top-center cell over a 3-wide row -->
  <use href="#blk" x="54" y="36" />
  <use href="#blk" x="18" y="72" />
  <use href="#blk" x="54" y="72" />
  <use href="#blk" x="90" y="72" />
</svg>
